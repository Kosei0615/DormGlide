<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800;900&display=swap">
<style>
*{box-sizing:border-box} body{margin:0}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:"Nunito Sans",Arial,sans-serif;display:flex;flex-direction:column}
.foot{margin-top:auto;display:flex;align-items:center;gap:34px;padding:34px 64px 40px}
.foot img.qr{width:210px;height:210px;border-radius:20px;background:#fff;border:8px solid #fff;flex-shrink:0}
.foot .t1{font-size:34px;font-weight:800;opacity:.9}
.foot .t2{font-size:64px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.foot .t3{font-size:28px;font-weight:800;opacity:.9;margin-top:8px}
/* slide 1: split cover */
.cover{background:#1d4ed8;color:#fff}
.half{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 72px;position:relative}
.half.b{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.half.o{background:linear-gradient(135deg,#c2410c,#fb923c)}
.half .k{font-size:34px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.half h1{margin:10px 0 0;font-size:118px;line-height:.95;font-weight:900;letter-spacing:-.035em}
.half p{margin:18px 0 0;font-size:36px;font-weight:700;opacity:.95}
.badge{position:absolute;right:64px;top:50%;transform:translateY(-50%);width:230px;height:230px;border-radius:56px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.swipe{position:absolute;right:64px;bottom:22px;font-size:30px;font-weight:900;background:rgba(255,255,255,.22);border-radius:999px;padding:8px 22px}
.cover .foot{background:#fff;color:#1e3a8a}.cover .foot .t2{color:#ea580c}
/* slides 2-3: light, photo/tile led */
.light{background:#f8fafc;color:#0f172a}
.bar{height:26px}.bar.b{background:linear-gradient(90deg,#1e3a8a,#2563eb)}.bar.o{background:linear-gradient(90deg,#c2410c,#fb923c)}
.pad{padding:54px 64px 0}
.kick{font-size:30px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.light h2{margin:10px 0 0;font-size:92px;line-height:.98;font-weight:900;letter-spacing:-.03em}
.photo{margin:38px 64px 0;position:relative;border-radius:34px;overflow:hidden;box-shadow:0 18px 40px rgba(15,23,42,.18)}
.photo img{display:block;width:100%;height:400px;object-fit:cover}
.photo .sold{position:absolute;left:24px;top:24px;background:#dc2626;color:#fff;font-size:34px;font-weight:900;letter-spacing:.1em;padding:8px 24px;border-radius:14px}
.photo .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(15,23,42,.85));color:#fff;font-size:32px;font-weight:800;padding:60px 28px 22px}
.steps{display:flex;gap:18px;margin:34px 64px 0}
.steps div{flex:1;background:#fff;border-radius:24px;padding:22px 20px;font-size:28px;font-weight:800;line-height:1.2;box-shadow:0 8px 20px rgba(15,23,42,.08)}
.steps b{display:block;font-size:44px;font-weight:900;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:40px 64px 0}
.tile{background:#fff;border:3px solid #fed7aa;border-radius:26px;padding:22px 10px;text-align:center;box-shadow:0 8px 20px rgba(154,52,18,.08)}
.tile .g{font-size:64px;line-height:1}.tile .n{font-size:26px;font-weight:900;margin-top:10px;line-height:1.1;color:#7c2d12}
.duo{display:flex;gap:18px;margin:34px 64px 0}
.duo div{flex:1;border-radius:26px;padding:24px 26px;font-size:30px;font-weight:800;line-height:1.25}
.duo .a{background:#fff;border:3px solid #fed7aa;color:#7c2d12}.duo .c{background:#ea580c;color:#fff}
.duo b{display:block;font-size:38px;font-weight:900;margin-bottom:6px}
.light .foot.b{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff}
.light .foot.o{background:linear-gradient(135deg,#c2410c,#fb923c);color:#fff}
</style></head><body><div class="s cover">
  <div class="half b"><div class="k">DormGlide</div><h1>Sell your<br>stuff.</h1><p>Fridges, textbooks, furniture.</p></div>
  <div class="half o"><div class="k">Glyde</div><h1>Book a<br>student.</h1><p>Move-in help, rides, tutoring.</p><div class="swipe">Swipe →</div></div>
  <img class="badge" src="otter-mark.png">
  <div class="foot "><img class="qr" src="qr-ig.png"><div><div class="t1">Scan to sign up, or go to</div><div class="t2">dormglide.com</div><div class="t3">Free · Denison students only</div></div></div></div></body></html>
