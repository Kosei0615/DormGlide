<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800;900&display=swap">
<style>
*{box-sizing:border-box} body{margin:0}
.story{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:"Nunito Sans",Arial,sans-serif;color:#fff;
 background:linear-gradient(160deg,#1e3a8a 0%,#1d4ed8 55%,#2563eb 100%);padding:260px 84px 200px;display:flex;flex-direction:column}

h1{font-size:112px;line-height:.98;font-weight:900;letter-spacing:-.03em;margin:120px 0 0}h1 span{color:#fdba74}.orange h1 span{color:#ffedd5}
p.lead{font-size:42px;line-height:1.32;font-weight:700;margin:44px 0 0;opacity:.95}

.bottom{margin-top:auto;display:flex;flex-direction:column;gap:22px}
