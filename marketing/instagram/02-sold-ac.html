<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800;900&display=swap">
<style>
* { box-sizing: border-box; } body { margin:0; }
.post { width:1080px; height:1080px; position:relative; overflow:hidden; font-family:"Nunito Sans", Arial, sans-serif; color:#fff;
  background: linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 58%,#2563eb 100%); padding:70px 80px 64px; display:flex; flex-direction:column; }
.post.orange { background: linear-gradient(135deg,#c2410c,#ea580c 60%,#fb923c); }
.top { display:flex; align-items:center; gap:22px; }
.top img { width:96px; height:96px; border-radius:24px; }
.wm { font-size:56px; font-weight:900; letter-spacing:-0.02em; line-height:1; } .wm em { font-style:normal; color:#fdba74; }
.orange .wm em { color:#ffedd5; }
.tag { font-size:24px; font-weight:700; opacity:.85; margin-top:6px; }
h1 { font-size:88px; line-height:1.0; font-weight:900; letter-spacing:-0.03em; margin:48px 0 0; }
h1 span { color:#fdba74; } .orange h1 span { color:#ffedd5; }
p.lead { font-size:34px; line-height:1.3; font-weight:700; margin:26px 0 0; max-width:860px; opacity:.95; }
.steps { margin-top:40px; display:flex; flex-direction:column; gap:18px; }
.step { display:flex; align-items:center; gap:26px; background:rgba(255,255,255,.14); border:2px solid rgba(255,255,255,.35); border-radius:26px; padding:18px 28px; }
.step .n { width:64px; height:64px; border-radius:50%; background:#fdba74; color:#1e3a8a; font-size:40px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.step .t { font-size:33px; font-weight:800; line-height:1.15; }
.sold { margin-top:48px; background:#fff; color:#1f2937; border-radius:36px; padding:30px 36px; display:flex; align-items:center; gap:40px; }
.sold .g { font-size:150px; line-height:1; } .sold img.photo { width:340px; height:240px; object-fit:cover; border-radius:22px; flex-shrink:0; box-shadow:0 10px 30px rgba(0,0,0,.18); }
.sold .name { font-size:54px; font-weight:900; color:#1e3a8a; letter-spacing:-0.02em; line-height:1.05; }
.sold .meta { font-size:30px; font-weight:700; color:#475569; margin-top:10px; }
.ribbon { position:absolute; top:48px; right:-120px; width:460px; transform:rotate(45deg); background:#dc2626; color:#fff; text-align:center; font-size:40px; font-weight:900; letter-spacing:.12em; padding:14px 0; box-shadow:0 10px 30px rgba(0,0,0,.3); }
.bottom { margin-top:auto; padding-top:28px; display:flex; flex-direction:column; align-items:flex-start; gap:18px; }
.url { font-size:44px; font-weight:900; letter-spacing:-0.01em; }
.rule { background:#fef3c7; color:#92400e; border:3px solid #fcd34d; border-radius:20px; padding:14px 24px; font-size:27px; font-weight:800; }
.otter { position:absolute; right:60px; top:230px; width:380px; opacity:.95; filter:drop-shadow(0 12px 30px rgba(0,0,0,.25)); }
</style></head><body><div class="post"><div class="top"><img src="otter-mark.png"><div><div class="wm">Dorm<em>Glide</em></div><div class="tag">The marketplace for Denison students</div></div></div><div class="ribbon">SOLD</div><h1>It's already<br><span>working.</span></h1>
   <div class="sold"><img class="photo" src="ac.jpg"><div><div class="name">Window AC unit</div><div class="meta">Listed on DormGlide · picked up on campus · paid at pickup</div></div></div>
   <p class="lead">Someone on campus is looking for what's sitting in your room.</p><div class="bottom"><div class="url">dormglide.com</div><div class="rule">💡 Free to use. No fees, ever.</div></div></div></body></html>
