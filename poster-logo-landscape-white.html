<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>DormGlide logo poster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800;900&display=swap">
<style>
  @page { size: 17in 11in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: "Nunito Sans", "Avenir Next", Arial, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { width: 17in; height: 11in; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .tile { position: relative; border-radius: 22%; overflow: hidden; flex-shrink: 0; background: linear-gradient(to bottom right, #003998 0 50%, #f75c12 50% 100%); box-shadow: 0 0.12in 0.4in rgba(0,0,0,0.18); }
  .tile img { position: absolute; left: 50%; top: 50%; width: 90%; transform: translate(-50%, -50%); }
  .wm { font-weight: 900; letter-spacing: -0.03em; line-height: 0.95; }
  .tag { font-weight: 800; letter-spacing: 0.01em; }
  .url { font-weight: 900; letter-spacing: 0.02em; }
  /* full-color sheets: otter at the exact center, name above, address below */
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); filter: drop-shadow(0 0.08in 0.2in rgba(0,0,0,0.18)); }
  .above, .below { position: absolute; left: 0; right: 0; text-align: center; color: #fff; }
  .sheet { background:#fff; } .row { display:flex; align-items:center; gap:0.6in; }
     .wm { font-size:1.66in; } .d { color:#003998; } .g { color:#f75c12; }
     .tag { font-size:0.4in; color:#334155; margin-top:0.28in; } .url { font-size:0.5in; color:#003998; margin-top:0.2in; }
</style></head><body><div class="sheet"><div class="row"><div class="tile" style="width:5.3in;height:5.3in"><img src="brand/otter-white-hires.png" alt=""></div><div class="txt"><div class="wm"><span class="d">Dorm</span><span class="g">Glide</span></div>
     <div class="tag">The marketplace for Denison students</div><div class="url">dormglide.com</div></div></div></div></body></html>
